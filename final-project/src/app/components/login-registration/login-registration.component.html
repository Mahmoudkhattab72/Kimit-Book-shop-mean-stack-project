<div class="title">
    <h1>Clients</h1>
</div>
<section class="data">
  <table class="table table-dark">
    <thead>
      <tr>
        <th scope="col">Email</th>
        <th scope="col">Name</th>
        <th scope="col">Password</th>
        <th scope="col">Address</th>
        <th scope="col">City</th>
        <th colspan ="2" style="text-align: center;">Update/Delete</th>
      </tr>
    </thead>
    <tbody>
      @for (s of signup; track $index) {
        <tr>
          <td scope="row">{{s.signupEmailFormControl}}</td>
          <td>{{s.signupNameFormControl}}</td>
          <td>{{s.signupPasswordFormControl}}</td>
          <td>{{s.signupAddressFormControl}}</td>
          <td>{{s.signupCityFormControl}}</td>
          <td><button type="button" class="btn btn-primary" (click)="onUpdateData(s,$index)">Update</button></td>
          <td><button type="button" class="btn btn-danger" (click)="onDeleteData(s,$index)">Delete</button></td>
        </tr>
      }
    </tbody>
  </table>
</section>
